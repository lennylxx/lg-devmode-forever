name: Build IPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.5

      - name: Check syntax and build IPK
        run: ./build.sh

      - name: Upload IPK
        uses: actions/upload-artifact@v7
        with:
          name: lg-devmode-forever
          path: com.lennylxx.devmodeforever_*.ipk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lg-devmode-forever

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: com.lennylxx.devmodeforever_*.ipk
          fail_on_unmatched_files: true
